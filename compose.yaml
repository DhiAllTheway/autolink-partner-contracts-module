services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
    environment:
      DATABASE_URL: mysql://root:@database:3306/autolinkdb
    depends_on:
      - database
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - php
    restart: unless-stopped

  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: autolinkdb
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - database_data:/var/lib/mysql:rw
    restart: unless-stopped

volumes:
  database_data:
